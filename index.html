<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f1a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>FinTrack</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var div = document.createElement('div');
        div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#b91c1c;color:#fff;padding:16px;z-index:999999;font-family:monospace;font-size:13px;white-space:pre-wrap;';
        div.innerText = '⚠️ Runtime Error:\n' + (e.message || e.error) + '\nFile: ' + e.filename + ':' + e.lineno;
        document.body.appendChild(div);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var div = document.createElement('div');
        div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#b91c1c;color:#fff;padding:16px;z-index:999999;font-family:monospace;font-size:13px;white-space:pre-wrap;';
        div.innerText = '⚠️ Promise Rejection:\n' + (e.reason && (e.reason.stack || e.reason.message || e.reason));
        document.body.appendChild(div);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
